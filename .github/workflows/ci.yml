name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Run FIM/NES tests
        run: npm run test:fim-nes

      # vscode-test 仅在本地环境运行
      # - name: Download VS Code 1.138.0 test host
      #   run: >-
      #     node --input-type=module -e "import { appendFileSync } from 'node:fs';
      #     import { downloadAndUnzipVSCode } from '@vscode/test-electron';
      #     const executablePath = await downloadAndUnzipVSCode('1.138.0');
      #     appendFileSync(process.env.GITHUB_ENV, 'VSCODE_EXECUTABLE_PATH=' + executablePath + '\n');"

      # - name: Run VS Code integration tests
      #   run: xvfb-run -a npm run test:vscode

      - name: Run remote-extra generator tests
        run: node --test website/scripts/generate-config-index.test.mjs

      - name: Package extension
        run: npm run package

      - name: Package FIM/NES extension
        run: npm run package:fim-nes

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: |
            ./*.vsix
            extensions/gcmp-fim-nes/*.vsix
          retention-days: 7
